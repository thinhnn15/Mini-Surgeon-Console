name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-msvc
          - os: ubuntu-24.04
            preset: linux-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Not in the default install; qt_add_shaders (qsb) needs it for the video shaders.
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMSC_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-asan
            name: linux-asan (ASan + UBSan)
          - preset: linux-tsan
            name: linux-tsan (ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Kernels 6.6+ randomise mmap with more bits than TSan's shadow memory layout allows
      # ("FATAL: ThreadSanitizer: unexpected memory mapping"). Lower it for this job only.
      - name: Allow TSan memory layout
        if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMSC_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  static-analysis:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format clang-tidy
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-asan
      - name: clang-tidy
        run: git ls-files 'common/*.cpp' 'video/*.cpp' 'arm_sim/*.cpp' | xargs clang-tidy -p build/linux-asan --quiet
