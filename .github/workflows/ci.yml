name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-msvc
          - os: ubuntu-24.04
            preset: linux-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Not in the default install. qtshadertools: qt_add_shaders (qsb) for the video
          # shaders. qtmultimedia: the camera source (CI has no camera; it tests the fallback).
          modules: 'qtshadertools qtmultimedia'
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMSC_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      # Not a test (a shared CI runner's timing proves nothing), a measurement for the journal:
      # how evenly the arm's 1 kHz loop ticks on this OS.
      - name: Arm loop timing
        shell: bash
        run: |
          exe=build/${{ matrix.preset }}/arm_sim/arm_sim
          [ -f "$exe" ] || exe=build/${{ matrix.preset }}/arm_sim/Debug/arm_sim.exe
          "$exe" --listen=127.0.0.1:0 --duration=3 --report

  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-asan
            name: linux-asan (ASan + UBSan)
          - preset: linux-tsan
            name: linux-tsan (ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Kernels 6.6+ randomise mmap with more bits than TSan's shadow memory layout allows
      # ("FATAL: ThreadSanitizer: unexpected memory mapping"). Lower it for this job only.
      - name: Allow TSan memory layout
        if: matrix.preset == 'linux-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMSC_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  static-analysis:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format clang-tidy
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-asan
      - name: clang-tidy
        run: git ls-files 'common/*.cpp' 'video/*.cpp' 'comms/*.cpp' 'arm_sim/*.cpp' 'teleop/*.cpp' 'tools/*.cpp' | xargs clang-tidy -p build/linux-asan --quiet
